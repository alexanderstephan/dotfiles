# ~/.tmux.conf

##############################################################################
# Prefix
##############################################################################
# Support Ctrl+a
set-option -g prefix C-a
bind-key C-a send-prefix

##############################################################################
# General
##############################################################################
# Use fish for all new panes/windows (login shell is fish, but tmux otherwise
# inherits the shell of whatever process started the server). Resolve fish from
# $PATH so this works regardless of where fish is installed on a given machine.
set -g default-shell "$SHELL"
set -g default-command "exec fish"

# Faster command sequences (fixes the delay after pressing Esc in vim).
set -sg escape-time 10

# Truecolor + italics. Assumes your outer terminal is xterm-256color.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase history
set-option -g history-limit 50000

# Focus events (lets vim/nvim autoread + gitgutter react to focus).
set -g focus-events on

# Index windows/panes from 1 (0 is a stretch on the keyboard).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##############################################################################
# Reload
##############################################################################
# prefix r  ->  reload this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##############################################################################
# Panes / windows
##############################################################################
# Easier pane splitting, keeping the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Rename the current WINDOW (prefix ,) and set a PANE title (prefix T).
# NOTE: tmux renames windows, not panes; panes carry a "title" instead. The
# titles show up in the status line / pane border below.
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind T command-prompt -p "pane title:" -I "#T" "select-pane -T '%%'"

# Show pane titles on the pane border.
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}} "

##############################################################################
# Mouse
##############################################################################
# Enable mouse mode.
set -g mouse on

# iTerm2 native right-click menu / copy: hold the Option (Alt) key while
# clicking. iTerm2 temporarily suspends mouse reporting so its own context
# menu and selection work, without any tmux binding.

##############################################################################
# Vim-aware pane navigation (pairs with christoomey/vim-tmux-navigator)
##############################################################################
# Seamlessly move between vim splits and tmux panes with C-h/j/k/l.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

##############################################################################
# Copy mode (vi-style)
##############################################################################
setw -g mode-keys vi

# Avoid jumps after selection (your originals, preserved).
bind-key    -T copy-mode    C-w               send-keys -X copy-selection
bind-key    -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection
bind-key    -T copy-mode    M-w               send-keys -X copy-selection
bind-key    -T copy-mode-vi C-j               send-keys -X copy-selection
bind-key    -T copy-mode-vi Enter             send-keys -X copy-selection
bind-key    -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# vi-ish selection start/toggle in copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

##############################################################################
# Status bar
##############################################################################
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour234,fg=colour250"

set -g status-left-length 30
set -g status-left "#[fg=colour234,bg=colour39,bold] #S #[fg=colour39,bg=colour234]"

set -g status-right-length 80
set -g status-right "#[fg=colour244] #{pane_current_command} #[fg=colour39,bg=colour234]#[fg=colour234,bg=colour39,bold] %Y-%m-%d %H:%M "

setw -g window-status-current-style "fg=colour234,bg=colour39,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=colour250,bg=colour234"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
